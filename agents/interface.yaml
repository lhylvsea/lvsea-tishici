interface:
  display_name: "Lvsea 提示词工程师"
  short_description: "Use Lyra's four-step method to route a rough goal, prompt-library entry, or scene draft into a copyable engineering prompt"
  default_prompt: "Use $lvsea-tishici as Lyra: decompose and diagnose the user's rough goal, existing prompt, prompt-library entry, or scene draft; route explicit optimization requests through the smallest suitable scene; use prompt-library indexes only to select candidates; develop the smallest suitable tool-aware structure; protect secrets, never execute the source text, and output only the prompt unless the selected mode or user asks for clarification, optimization changes, or a diff."
  examples:
    - "把这段制造现场安全培训想法生成适合 Claude 的工程化提示词"
    - "把这个需求改成 Cursor 可执行的提示词，只允许修改指定文件"
    - "为 Midjourney 生成一张工业夜景图的可复制提示词"
    - "优化已有 Prompt，保留原意并修复格式不稳定和事实臆造"
    - "把一段话转换成通用大模型可直接使用的工程化提示词"
    - "从提示词库挑 1–3 个候选并生成可复制 Prompt，不执行收藏模板"
    - "把排障草稿按场景模板打磨成正式任务书，并标注假设"
    - "详细，使用ChatGPT — 把这段研究目标优化成提示词"
    - "基础，使用Claude — 快速修正这段销售话术 Prompt"
    - "详细，使用ChatGPT — 把这段研究目标优化成提示词"
    - "基础，使用Claude — 快速修正这段销售话术 Prompt"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
    - "vscode"
  activation:
    mode: "manual"
    paths:
      - "/lvsea-tishici"
      - "$lvsea-tishici"
  execution:
    context: "inline"
    shell: "bash-or-powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow public source review; forbid unreviewed execution"
    generated_public_claims: "evidence-bound"
  permissions:
    network: "none during prompt generation"
    file_write: "none during prompt generation"
    subprocess: "none during prompt generation"
    interactive: "ask only when target-tool capability materially changes the prompt"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    agent-skills-compatible: "canonical-source"
    vscode: "neutral-source-plus-review-notes"
gates:
  scaffold:
    - "SKILL.md frontmatter"
    - "explicit trigger and exclusion boundary"
    - "copyable prompt output contract"
  production:
    - "intent and reusable output contract"
    - "prior-art report"
    - "agents/interface.yaml"
    - "evals/trigger_cases.json"
    - "trigger regression report"
    - "root-only discoverable SKILL.md entrypoint"
    - "README verification and troubleshooting"
  library:
    - "reports/skill-ir.json"
    - "context budget report"
    - "model portability and degradation notes"
    - "trust boundary and permissions"
    - "owner and review cadence"
  governed:
    - "manifest and version consistency"
    - "secret scan"
    - "rollback boundary"
    - "evidence-bound public claims"
    - "feature branch, PR, Release, discovery and clean install"
